<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Encodage -->
  <meta charset="UTF-8">

  <!-- Responsive mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Police Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <title>Tickethack</title>

</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <!-- Logo -->
    <div class="logo">
      Tickethack
    </div>

    <!-- Navigation -->
    <nav>

      <a href="#">Cart</a>

      <a href="#">Bookings</a>

    </nav>

  </header>

  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <!-- =========================
         TITRE
    ========================== -->

    <h1>
      Explore the world effortlessly by train!
    </h1>

    <!-- Sous-titre -->

    <p class="subtitle">
      Compare, book and enjoy cheap prices for train tickets:
      your journey starts on Tickethack.
    </p>

    <!-- =========================
         CONTAINER DES 2 CARDS
    ========================== -->

    <div class="cards">

      <!-- =========================
           CARD RECHERCHE
      ========================== -->

      <div class="search-card">

        <!-- Input départ -->
        <input
          id="departure"
          type="text"
          placeholder="Departure"
        >

        <!-- Input arrivée -->
        <input
          id="arrival"
          type="text"
          placeholder="Arrival"
        >

        <!-- Input date -->
        <input
          id="date"
          type="date"
        >

        <!-- Bouton recherche -->
        <button id="search-btn">

          Search

        </button>

      </div>

      <!-- =========================
           CARD RESULTATS
      ========================== -->

      <div class="result-card">

        <!-- Container dynamique :
             sera modifié en JavaScript
        -->

        <div id="results-container">

          <!-- État vide par défaut -->

          <img
            src="./images/train.png"
            alt="train"
          >

          <!-- Ligne -->

          <div class="line"></div>

          <!-- Texte -->

          <p>
            It's time to book your future trip.
          </p>

        </div>

      </div>

    </div>

  </main>

  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="script.js"></script>

</body>

</html>
